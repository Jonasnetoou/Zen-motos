name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    name: Build Android APK (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Gerar a pasta android/ (caso ainda não exista no repositório)
        # Como o projeto foi montado só com pubspec.yaml + lib/main.dart,
        # este comando cria toda a estrutura nativa Android (gradlew,
        # AndroidManifest, ícones, etc.) automaticamente a cada build.
        # Ele NÃO sobrescreve lib/ nem pubspec.yaml, que já existem.
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.zenmotos --project-name zen_motos .
          fi

      - name: Ajustar compileSdk/targetSdk/minSdk (compatibilidade com plugins)
        # Alguns plugins (shared_preferences, flutter_typeahead -> flutter_keyboard_visibility)
        # exigem compileSdk 36+. Forçamos valores fixos e mais altos que o padrão
        # gerado pelo `flutter create`, evitando erro de AAR metadata no build.
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts

      - name: Ajustar nome do app na tela inicial para "Zen Motos"
        # `flutter create` usa o nome técnico do projeto (zen_motos) como label.
        # Trocamos pelo nome de exibição correto no launcher do Android.
        run: |
          sed -i 's/android:label="zen_motos"/android:label="Zen Motos"/' android/app/src/main/AndroidManifest.xml

      - name: Instalar dependências (flutter pub get)
        run: flutter pub get

      - name: Gerar ícone do app a partir de assets/icon/icon.png
        run: dart run flutter_launcher_icons

      - name: Corrigir compileSdk do plugin flutter_keyboard_visibility (patch no pub cache)
        # Esse plugin (dependência interna do flutter_typeahead) foi publicado com
        # compileSdk desatualizado (31), o que quebra o build junto com dependências
        # mais novas (androidx.fragment, androidx.window etc. exigem 34+).
        # Corrigimos o arquivo gradle do plugin direto no cache do pub, que é
        # baixado de novo (limpo) a cada execução do CI.
        run: |
          find "$HOME/.pub-cache" -path "*flutter_keyboard_visibility*/android/build.gradle" -print -exec \
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' {} \;
          find "$HOME/.pub-cache" -path "*flutter_keyboard_visibility*/android/build.gradle.kts" -print -exec \
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' {} \;

      - name: Analisar código (opcional, não quebra o build)
        run: flutter analyze || true

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload do APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
