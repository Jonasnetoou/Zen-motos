name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    name: Build Android APK (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ------------------------------------------------------------------
      # OPCIONAL - Firebase (google-services.json)
      # Se o app usa Firebase, crie um secret no GitHub chamado
      # GOOGLE_SERVICES_JSON contendo o conteúdo do arquivo
      # android/app/google-services.json em Base64, e descomente o passo
      # abaixo para que ele seja restaurado antes do build.
      #
      # Gerar o Base64 localmente:
      #   base64 -i android/app/google-services.json | tr -d '\n'
      # ------------------------------------------------------------------
      # - name: Restaurar google-services.json
      #   run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Gerar a pasta android/ (caso ainda não exista no repositório)
        # Como o projeto foi montado só com pubspec.yaml + lib/main.dart,
        # este comando cria toda a estrutura nativa Android (gradlew,
        # AndroidManifest, ícones, etc.) automaticamente a cada build.
        # Ele NÃO sobrescreve lib/ nem pubspec.yaml, que já existem.
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.zenmotos --project-name zen_motos .
          fi

      - name: Ajustar compileSdk/targetSdk/minSdk (compatibilidade com plugins)
        # Alguns plugins (flutter_typeahead -> flutter_keyboard_visibility, firebase)
        # exigem compileSdk 34+. Forçamos valores fixos e mais altos que o padrão
        # gerado pelo `flutter create`, evitando erro de AAR metadata no build.
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts

      - name: Forçar compileSdk 35 em todos os módulos (inclusive plugins de terceiros)
        # Alguns plugins publicados no pub.dev (ex: flutter_keyboard_visibility,
        # dependência do flutter_typeahead) vêm com compileSdk desatualizado (31)
        # e isso quebra o build com erro de "AAR metadata". Este bloco força
        # compileSdk 35 em TODOS os subprojetos/plugins, não só no nosso app.
        run: |
          cat <<'EOF' >> android/build.gradle.kts

          subprojects {
              afterEvaluate {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.let { androidExt ->
                      androidExt.compileSdkVersion(35)
                  }
              }
          }
          EOF

      - name: Instalar dependências (flutter pub get)
        run: flutter pub get

      - name: Analisar código (opcional, não quebra o build)
        run: flutter analyze || true

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload do APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
