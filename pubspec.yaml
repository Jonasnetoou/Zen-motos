name: zen_motos
description: "Zen Motos - Orçamento Rápido"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Autocomplete (Cliente / Peça)
  flutter_typeahead: ^5.2.0

  # Geração de PDF
  pdf: ^3.11.1
  printing: ^5.13.3

  # Compartilhamento / Clipboard (WhatsApp)
  share_plus: ^10.1.2

  # Datas e moeda
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
