name: zen_motos
description: "Zen Motos - Orçamento Rápido"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Armazenamento local de clientes/peças (sem nuvem)
  shared_preferences: ^2.3.2

  # Autocomplete (Cliente / Peça)
  flutter_typeahead: ^5.2.0

  # Geração de PDF
  pdf: ^3.11.1
  printing: ^5.13.3

  # Compartilhamento / Clipboard (WhatsApp)
  share_plus: ^10.1.2

  # Datas e moeda
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.jpg

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 23
